<!DOCTYPE html>
<html class="dark" lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Semanario Deportivo — Juego de Equipo</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script>
tailwind.config={darkMode:"class",theme:{extend:{colors:{"surface-container":"#ffffff","surface":"#ffffff","on-surface":"#363B40","on-surface-variant":"#6b7280","surface-container-high":"#ffffff","surface-container-highest":"#f8f8f8","surface-container-low":"#ffffff","surface-variant":"#e8e8e8","primary":"#ED1C24","primary-dim":"#c9171e","on-primary":"#ffffff","primary-container":"#fde8e9","secondary":"#ffffff","tertiary":"#363B40","error":"#b91c1c","outline":"#d0d0d0","outline-variant":"#e0e0e0","background":"#ffffff","on-background":"#363B40"},fontFamily:{headline:["Lexend","sans-serif"],body:["Manrope","sans-serif"],label:["Manrope","sans-serif"]},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem","2xl":"1rem",full:"9999px"}}}}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#fff}::-webkit-scrollbar-thumb{background:#c3c8ce;border-radius:10px}::-webkit-scrollbar-thumb:hover{background:#ED1C24}
body{font-family:'Manrope',sans-serif;background:#ffffff;color:#363B40}
.cat-btn{transition:all .2s;border:1px solid #d7dce0}
.cat-btn.active{background:#ED1C24;color:#fff;box-shadow:0 10px 25px rgba(237,28,36,.18);border-color:#ED1C24}
.cat-btn:not(.active){background:#fff;color:#363B40}
.cat-btn:not(.active):hover{background:#fff1f2;color:#ED1C24;border-color:#f3a8ac}
.sec-tab{transition:all .2s;border-bottom:3px solid transparent;color:#6b7280}
.sec-tab.active{border-color:#ED1C24;color:#ED1C24}
.sec-tab:hover:not(.active){color:#363B40}
.fade-in{animation:fadeIn .3s ease}
.brand-shell{background:rgba(255,255,255,.78);backdrop-filter:blur(14px);border:1px solid rgba(215,220,224,.9);box-shadow:0 18px 48px rgba(54,59,64,.08)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body class="min-h-screen selection:bg-primary/20">

<div class="max-w-5xl mx-auto px-3 sm:px-6 py-4 sm:py-8">

  <!-- section tabs -->
  <div class="grid grid-cols-2 sm:flex gap-2 sm:gap-8 border-b border-outline-variant/20 mb-6">
    <button onclick="switchSec('posiciones')" id="tab-posiciones" class="sec-tab active pb-3 text-sm sm:text-base font-bold font-headline flex items-center justify-center sm:justify-start gap-1.5">
      <span class="material-symbols-outlined text-lg">format_list_numbered</span>Posiciones</button>
    <button onclick="switchSec('resultados')" id="tab-resultados" class="sec-tab pb-3 text-sm sm:text-base font-bold font-headline flex items-center justify-center sm:justify-start gap-1.5">
      <span class="material-symbols-outlined text-lg">calendar_month</span>Resultados</button>
    <button onclick="switchSec('goleadores')" id="tab-goleadores" class="sec-tab pb-3 text-sm sm:text-base font-bold font-headline flex items-center justify-center sm:justify-start gap-1.5">
      <span class="material-symbols-outlined text-lg">sports_soccer</span>Goleadores</button>
    <button onclick="switchSec('tarjetas')" id="tab-tarjetas" class="sec-tab pb-3 text-sm sm:text-base font-bold font-headline flex items-center justify-center sm:justify-start gap-1.5">
      <span class="material-symbols-outlined text-lg">style</span>Tarjetas</button>
  </div>

  <div class="mb-6 sm:mb-8 space-y-4">
    <div class="flex items-center justify-center gap-3 text-on-surface-variant text-xs sm:text-sm font-semibold">
      <span>Datos provistos por: </span>
      <a href="https://juegodeequipo.com.ar/" target="_blank" rel="noopener"><img data-jde-logo="powered" src="/assets/logo-negro.png" alt="Juego de Equipo" class="h-8 sm:h-10 w-auto object-contain" /></a>
    </div>
  </div>

  <div id="content"></div>
  <div id="loading" class="flex flex-col items-center justify-center py-16 gap-4">
    <div class="w-10 h-10 border-4 border-primary/30 border-t-primary rounded-full animate-spin"></div>
    <p class="text-on-surface-variant text-sm font-semibold">Cargando datos...</p>
  </div>
</div>

<script>
let DATA=null;
let curSec='posiciones';
function switchSec(s){curSec=s;['posiciones','resultados','goleadores','tarjetas'].forEach(x=>document.getElementById('tab-'+x).classList.toggle('active',x===s));render()}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function initials(name){return String(name||'').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'EQ'}
function render(){
  const d=DATA["Primera"];
  const el=document.getElementById('content');
  if(!d){el.innerHTML='<p class="text-center text-on-surface-variant py-12">Sin datos</p>';return}
  switch(curSec){
    case 'posiciones':el.innerHTML=renderPos(d.tabla);break;
    case 'resultados':el.innerHTML=renderRes(d.partidos);break;
    case 'goleadores':el.innerHTML=renderGol(d.goleadores);break;
    case 'tarjetas':el.innerHTML=renderTar(d.tarjetas);break;
  }
  el.classList.remove('fade-in');void el.offsetWidth;el.classList.add('fade-in');
}

/* ---------- posiciones ---------- */
function renderPos(t){
  if(!t||!t.length) return '<p class="text-center text-on-surface-variant py-12">No hay datos de posiciones</p>';
  const hdr='<tr class="bg-primary text-white text-xs uppercase tracking-[0.2em]">'
    +'<th class="px-4 sm:px-6 py-3 text-left w-12">#</th>'
    +'<th class="px-4 py-3 text-left">Equipo</th>'
    +'<th class="px-3 py-3 text-center">PJ</th>'
    +'<th class="px-3 py-3 text-center">DG</th>'
    +'<th class="px-4 sm:px-6 py-3 text-right">PTS</th></tr>';

  const rows=t.map((r,i)=>{
    const pc=i<3?'text-primary':'text-on-surface-variant';
    const rowBg=i<3?'bg-primary/5':'';
    const dg=r.dg>0?'+'+r.dg:String(r.dg);
    const dgc=r.dg>0?'text-emerald-600':r.dg<0?'text-error':'text-on-surface-variant';
    const logoSrc=r.escudo||'';
    const badge=logoSrc
      ?'<img src="'+esc(logoSrc)+'" alt="'+esc(r.equipo)+'" class="w-10 h-10 rounded-xl object-cover shrink-0 border border-outline-variant/20 bg-white" onerror="this.outerHTML=\'&lt;div class=&quot;w-10 h-10 rounded-xl bg-primary/10 text-primary flex items-center justify-center shrink-0 font-black text-xs&quot;&gt;'+esc(initials(r.equipo))+'&lt;/div&gt;\'"/>'
      :'<div class="w-10 h-10 rounded-xl bg-primary/10 text-primary flex items-center justify-center shrink-0 font-black text-xs">'+esc(initials(r.equipo))+'</div>';
    return '<tr class="group hover:bg-primary/5 transition-colors '+rowBg+'">'
      +'<td class="px-4 sm:px-6 py-4 font-headline font-black text-base '+pc+'">'+String(i+1).padStart(2,'0')+'</td>'
      +'<td class="px-4 py-4"><div class="flex items-center gap-3">'
      +badge
      +'<span class="font-bold group-hover:text-primary transition-colors">'+esc(r.equipo)+'</span></div></td>'
      +'<td class="px-3 py-4 text-center text-on-surface-variant font-semibold">'+r.pj+'</td>'
      +'<td class="px-3 py-4 text-center font-mono font-semibold '+dgc+'">'+dg+'</td>'
      +'<td class="px-4 sm:px-6 py-4 text-right font-headline font-black text-lg text-primary">'+r.puntos+'</td></tr>';
  }).join('');

  const mobile=t.map((r,i)=>{
    const dg=r.dg>0?'+'+r.dg:String(r.dg);
    const dgc=r.dg>0?'text-emerald-600':r.dg<0?'text-error':'text-on-surface-variant';
    const logoSrc=r.escudo||'';
    const badge=logoSrc
      ?'<img src="'+esc(logoSrc)+'" alt="'+esc(r.equipo)+'" class="w-12 h-12 rounded-2xl object-cover shrink-0 border border-outline-variant/20 bg-white" onerror="this.outerHTML=\'&lt;div class=&quot;w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center shrink-0 font-black text-xs&quot;&gt;'+esc(initials(r.equipo))+'&lt;/div&gt;\'"/>'
      :'<div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center shrink-0 font-black text-xs">'+esc(initials(r.equipo))+'</div>';
    return '<article class="sm:hidden bg-surface-container-high rounded-2xl border border-outline-variant/20 shadow-[0_14px_35px_rgba(54,59,64,0.07)] p-4 mb-3">'
      +'<div class="flex items-center gap-3 mb-4">'+badge
      +'<div class="min-w-0 flex-1"><p class="text-xs uppercase tracking-[0.2em] '+(i<3?'text-primary':'text-on-surface-variant')+' font-black">#'+String(i+1).padStart(2,'0')+'</p>'
      +'<h3 class="font-bold text-sm leading-tight text-on-surface">'+esc(r.equipo)+'</h3></div>'
      +'<div class="text-right"><p class="text-[11px] uppercase tracking-[0.18em] text-on-surface-variant font-black">PTS</p><p class="text-2xl font-headline font-black text-primary">'+r.puntos+'</p></div></div>'
      +'<div class="grid grid-cols-3 gap-2 text-center">'
      +'<div class="rounded-xl bg-surface-container-low border border-outline-variant/20 px-2 py-3"><p class="text-[11px] uppercase tracking-[0.18em] text-on-surface-variant font-black">PJ</p><p class="mt-1 text-base font-black text-on-surface">'+r.pj+'</p></div>'
      +'<div class="rounded-xl bg-surface-container-low border border-outline-variant/20 px-2 py-3"><p class="text-[11px] uppercase tracking-[0.18em] text-on-surface-variant font-black">DG</p><p class="mt-1 text-base font-black '+dgc+'">'+dg+'</p></div>'
      +'<div class="rounded-xl bg-primary/8 border border-primary/15 px-2 py-3"><p class="text-[11px] uppercase tracking-[0.18em] text-primary font-black">PTS</p><p class="mt-1 text-base font-black text-primary">'+r.puntos+'</p></div>'
      +'</div></article>';
  }).join('');

  return mobile+'<div class="hidden sm:block bg-surface-container-high rounded-2xl border border-outline-variant/20 overflow-hidden shadow-[0_18px_45px_rgba(54,59,64,0.08)]">'
    +'<table class="w-full text-sm"><thead>'+hdr+'</thead><tbody class="divide-y divide-outline-variant/10">'+rows+'</tbody></table></div>';
}

/* ---------- resultados ---------- */
function renderRes(partidos){
  if(!partidos||!partidos.length) return '<p class="text-center text-on-surface-variant py-12">No hay partidos registrados</p>';
  const byJ={};
  partidos.forEach(p=>{const j=p.jornada||0;if(!byJ[j])byJ[j]=[];byJ[j].push(p)});
  const nums=Object.keys(byJ).map(Number).sort((a,b)=>a-b);

  return '<div class="space-y-6">'+nums.map(j=>{
    const mm=byJ[j];
    const jugados=mm.filter(m=>m.estado==='jugado').length;
    const enCurso=mm.filter(m=>m.estado==='en_curso').length;
    const statusText=enCurso>0?jugados+'/'+mm.length+' finalizados • '+enCurso+' en vivo':jugados+'/'+mm.length+' jugados';
    return '<div class="bg-surface-container-high rounded-2xl border border-outline-variant/10 overflow-hidden">'
      +'<div class="px-4 sm:px-6 py-3 sm:py-4 border-b border-outline-variant/10 flex items-center justify-between">'
      +'<h3 class="font-headline font-bold text-base sm:text-lg">Fecha '+(j||'?')+'</h3>'
      +'<span class="text-xs text-on-surface-variant bg-surface-container px-2 py-1 rounded-lg">'+statusText+'</span></div>'
      +'<div class="divide-y divide-outline-variant/5">'+mm.map(p=>{
        const played=p.estado==='jugado';
        const enCurso=p.estado==='en_curso';
        const showScore=played||enCurso;
        const localLogo=p.localEscudo||'';
        const visitanteLogo=p.visitanteEscudo||'';
        const le=localLogo?'<img src="'+esc(localLogo)+'" alt="" class="w-6 h-6 sm:w-8 sm:h-8 rounded-full object-cover shrink-0" onerror="this.style.display=\'none\'"/>':'';
        const ve=visitanteLogo?'<img src="'+esc(visitanteLogo)+'" alt="" class="w-6 h-6 sm:w-8 sm:h-8 rounded-full object-cover shrink-0" onerror="this.style.display=\'none\'"/>':'';
        const score=showScore
          ?'<span class="'+(enCurso?'bg-amber-500/20 text-amber-600':'bg-primary/20 text-primary')+' font-black px-3 sm:px-4 py-1.5 rounded-xl text-sm sm:text-lg min-w-[60px] sm:min-w-[80px] text-center inline-block font-headline'+(enCurso?' animate-pulse':'')+'">'+(p.golesLocal||0)+' - '+(p.golesVisitante||0)+(enCurso?' 🟡':'')+'</span>'
          :'<span class="bg-surface-container text-on-surface-variant px-3 py-1.5 rounded-xl text-xs font-semibold">Pendiente</span>';
        return '<div class="px-3 sm:px-6 py-3 sm:py-4 flex items-center gap-2 sm:gap-4 hover:bg-primary/5 transition-colors">'
          +'<div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">'+le
          +'<span class="font-bold text-right flex-1 text-xs sm:text-sm truncate">'+esc(p.local)+'</span></div>'
          +'<div class="shrink-0">'+score+'</div>'
          +'<div class="flex items-center gap-2 sm:gap-3 flex-1 min-w-0">'
          +'<span class="font-bold flex-1 text-xs sm:text-sm truncate">'+esc(p.visitante)+'</span>'+ve+'</div></div>';
      }).join('')+'</div></div>';
  }).join('')+'</div>';
}

/* ---------- goleadores ---------- */
function renderGol(g){
  if(!g||!g.length) return '<p class="text-center text-on-surface-variant py-12">No hay goleadores registrados</p>';
  const rows=g.slice(0,20).map((x,i)=>{
    const medal=i===0?'\u{1F947}':i===1?'\u{1F948}':i===2?'\u{1F949}':'';
    return '<tr class="group hover:bg-primary/5 transition-colors">'
      +'<td class="px-4 sm:px-6 py-3.5 font-headline font-black '+(i<3?'text-primary':'text-on-surface-variant')+'">'+(medal||String(i+1).padStart(2,'0'))+'</td>'
      +'<td class="px-4 py-3.5 font-bold group-hover:text-primary transition-colors">'+esc(x.nombre)+'</td>'
      +'<td class="px-4 py-3.5 text-on-surface-variant">'+esc(x.equipo)+'</td>'
      +'<td class="px-4 sm:px-6 py-3.5 text-right"><span class="inline-flex items-center bg-primary/10 text-primary px-3 py-1 rounded-full font-headline font-black text-base">'+x.goles+'</span></td></tr>';
  }).join('');

  return '<div class="bg-surface-container-high rounded-2xl border border-outline-variant/10 overflow-hidden"><div class="overflow-x-auto">'
    +'<table class="w-full text-sm"><thead><tr class="bg-surface-container text-on-surface-variant text-xs uppercase tracking-wider">'
    +'<th class="px-4 sm:px-6 py-3 text-left w-12">#</th><th class="px-4 py-3 text-left">Jugador</th>'
    +'<th class="px-4 py-3 text-left">Equipo</th><th class="px-4 sm:px-6 py-3 text-right">Goles</th>'
    +'</tr></thead><tbody class="divide-y divide-outline-variant/5">'+rows+'</tbody></table></div></div>';
}

/* ---------- tarjetas ---------- */
function renderTar(t){
  const am=t&&t.amarillas||[];const ro=t&&t.rojas||[];
  if(!am.length&&!ro.length) return '<p class="text-center text-on-surface-variant py-12">No hay tarjetas registradas</p>';

  function tbl(items,emoji,field){
    if(!items.length) return '<p class="text-center text-on-surface-variant py-8 text-sm">Sin tarjetas</p>';
    return '<table class="w-full text-sm"><thead><tr class="bg-surface-container text-on-surface-variant text-xs uppercase tracking-wider">'
      +'<th class="px-4 py-2.5 text-left w-10">#</th><th class="px-3 py-2.5 text-left">Jugador</th>'
      +'<th class="px-3 py-2.5 text-left hidden sm:table-cell">Equipo</th>'
      +'<th class="px-4 py-2.5 text-right">'+emoji+'</th></tr></thead>'
      +'<tbody class="divide-y divide-outline-variant/5">'+items.slice(0,15).map((x,i)=>
        '<tr class="hover:bg-primary/5 transition-colors"><td class="px-4 py-3 font-bold text-on-surface-variant">'+(i+1)+'</td>'
        +'<td class="px-3 py-3 font-bold">'+esc(x.nombre)+'</td>'
        +'<td class="px-3 py-3 text-on-surface-variant hidden sm:table-cell">'+esc(x.equipo)+'</td>'
        +'<td class="px-4 py-3 text-right font-headline font-black">'+x[field]+'</td></tr>'
      ).join('')+'</tbody></table>';
  }

  return '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6">'
    +'<div class="bg-surface-container-high rounded-2xl border border-outline-variant/10 overflow-hidden">'
    +'<div class="px-4 sm:px-6 py-3 border-b border-outline-variant/10"><h3 class="font-headline font-bold flex items-center gap-2">\u{1F7E8} Tarjetas Amarillas</h3></div>'
    +tbl(am,'\u{1F7E8}','amarilla')+'</div>'
    +'<div class="bg-surface-container-high rounded-2xl border border-outline-variant/10 overflow-hidden">'
    +'<div class="px-4 sm:px-6 py-3 border-b border-outline-variant/10"><h3 class="font-headline font-bold flex items-center gap-2">\u{1F7E5} Tarjetas Rojas</h3></div>'
    +tbl(ro,'\u{1F7E5}','roja')+'</div></div>';
}

(function(){
  if(DATA){document.getElementById('loading').style.display='none';render();return}
  fetch('/api/semanario-data')
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
    .then(d=>{DATA=d;document.getElementById('loading').style.display='none';render()})
    .catch(e=>{document.getElementById('loading').innerHTML='<p class="text-center text-error py-12 font-semibold">Error al cargar datos</p>';console.error('semanario fetch:',e)});
})();
</script>
 <script>
function sendHeight() {
  const height = Math.max(
    document.body.scrollHeight,
    document.documentElement.scrollHeight
  );

  window.parent.postMessage(
    { type: "resize-iframe", height: height },
    "https://www.veradia.com"
  );
}

window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);

const observer = new MutationObserver(sendHeight);
observer.observe(document.body, {
  childList: true,
  subtree: true,
  attributes: true,
  attributeFilter: ["style", "class"]
});
</script>
</body>
</html>
