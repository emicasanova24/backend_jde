<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1;&display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#8c52ff",
            "background-light": "#f8f6f6",
            "background-dark": "#0f0a08",
          },
          fontFamily: {
            display: ["Public Sans", "sans-serif"],
          },
        },
      },
    };
  </script>
  <title>Login — Juego de Equipo</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 antialiased">
  <div class="relative flex min-h-screen w-full flex-col items-center justify-center overflow-x-hidden p-4">
    <div class="absolute inset-0 z-0 overflow-hidden">
      <div class="absolute -top-[10%] -left-[10%] h-[40%] w-[40%] rounded-full bg-primary/10 blur-[120px]"></div>
      <div class="absolute -bottom-[10%] -right-[10%] h-[40%] w-[40%] rounded-full bg-primary/5 blur-[120px]"></div>
    </div>
    <div class="z-10 w-full max-w-md">
      <div class="flex flex-col items-center mb-6 sm:mb-8">
        <div class="mb-4 sm:mb-6 h-auto w-[140px] sm:w-[180px] md:w-[200px] overflow-hidden rounded-xl">
          <img alt="Juego de Equipo official logo" class="h-full w-full object-contain" src="/assets/logo.png" />
        </div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white text-center">Bienvenido de nuevo</h1>
        <p class="mt-1 sm:mt-2 text-sm text-slate-600 dark:text-slate-400">Portal de administración y gestión</p>
      </div>
      <div class="rounded-2xl border border-slate-200 bg-white p-4 sm:p-6 md:p-8 shadow-xl dark:border-slate-800 dark:bg-slate-900/50 backdrop-blur-sm">
        <form id="loginForm" class="space-y-6" method="POST">
          <div class="flex flex-col gap-2">
            <label for="email" class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300">Correo del Administrador</label>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute text-slate-400 dark:text-slate-500"></span>
              <input id="email" name="email" type="email" placeholder="admin@juegodeequipo.com" required class="flex h-10 sm:h-12 w-full rounded-xl border border-slate-200 bg-slate-50 py-2 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800/50 dark:text-slate-100" />
            </div>
          </div>
          <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between">
              <label for="password" class="text-sm font-medium leading-none text-slate-700 dark:text-slate-300">Contraseña</label>
              <a href="#" class="text-xs font-medium text-primary hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <div class="relative flex items-center">
              <span class="material-symbols-outlined absolute text-slate-400 dark:text-slate-500"></span>
              <input id="password" name="password" type="password" placeholder="********" required class="flex h-10 sm:h-12 w-full rounded-xl border border-slate-200 bg-slate-50 py-2 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 dark:border-slate-700 dark:bg-slate-800/50 dark:text-slate-100" />
            </div>
          </div>
          <div class="flex items-center space-x-2">
            <input id="remember" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary" />
            <label for="remember" class="text-sm font-medium text-slate-600 dark:text-slate-400">Mantener sesión iniciada por 30 días</label>
          </div>
          <button type="submit" class="flex h-10 sm:h-12 w-full items-center justify-center rounded-xl bg-primary px-4 py-2 text-sm font-bold text-white shadow-lg shadow-primary/20 hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 active:scale-[0.98]">Iniciar sesión</button>
        </form>
      </div>
      <div class="mt-6 sm:mt-8 flex flex-wrap justify-center gap-4 sm:gap-6 text-xs font-medium text-slate-500 dark:text-slate-500">
        <a href="#" class="hover:text-primary transition-colors">Política de Seguridad</a>
        <a href="#" class="hover:text-primary transition-colors">Centro de Ayuda</a>
        <a href="#" class="hover:text-primary transition-colors">Estado de la Plataforma</a>
      </div>
    </div>
  </div>
  <script>
    const loginForm = document.getElementById("loginForm");
    if (loginForm) {
      loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          alert("Email y contraseña son requeridos");
          return;
        }

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });
          const result = await response.json();

          if (response.ok && result.success && result.token) {
            localStorage.setItem("token", result.token);
            window.location.href = "dashboard.html";
          } else {
            alert(result.message || "Credenciales inválidas");
          }
        } catch (error) {
          console.error("Login error", error);
          alert("Error de conexión. Intenta nuevamente.");
        }
      });
    }
  </script>
</body>
</html>
