<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fixture — Juego de Equipo</title>
  <link rel="icon" type="image/png" href="/assets/logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <div id="sharedNav"></div>
  <main class="container mx-auto px-3 sm:px-4 md:px-6 py-4 sm:py-6">
    <h1 class="text-xl sm:text-2xl md:text-3xl font-bold mb-4 sm:mb-5">Fixture Automático Apertura</h1>
    <div class="flex flex-col sm:flex-row gap-2 mb-4">
      <button id="generarFixture" class="bg-blue-600 text-white rounded px-4 py-2 text-sm">Generar fixture todos contra todos</button>
      <button id="saveFixture" class="bg-emerald-600 text-white rounded px-4 py-2 text-sm">Guardar fixture en backend</button>
    </div>
    <div id="fixtureFechas" class="space-y-6"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
